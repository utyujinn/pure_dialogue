<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AI VRM Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background:
    radial-gradient(ellipse at 65% 25%, rgba(140,30,180,0.35) 0%, transparent 55%),
    radial-gradient(ellipse at 30% 70%, rgba(0,200,220,0.25) 0%, transparent 55%),
    linear-gradient(to bottom,
      #04041a 0%,
      #0a0e50 18%,
      #0d2e80 38%,
      #085a94 58%,
      #00a0be 72%,
      #007aaa 85%,
      #00436e 100%
    );
  overflow: hidden;
  font-family: sans-serif;
  color: #eee;
}
canvas#canvas { display: block; }

#ui {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 16px 24px 100px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
#transcript { font-size: 14px; color: #ddd; min-height: 20px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
#response   { font-size: 16px; color: #fff; min-height: 24px; line-height: 1.5; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }

/* 波形キャンバス */
#waveCanvas {
  position: fixed;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%);
  width: 320px;
  height: 56px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
}
#waveCanvas.active { opacity: 1; }

/* マイクデバイス選択 */
#micSelect {
  position: fixed;
  bottom: 96px;
  right: 24px;
  width: 200px;
  padding: 6px 8px;
  background: rgba(30,30,50,0.85);
  border: 1px solid #444;
  border-radius: 8px;
  color: #ccc;
  font-size: 12px;
  cursor: pointer;
  display: none;
}
#micSelect.visible { display: block; }

#micBtn {
  position: fixed;
  bottom: 24px; right: 24px;
  width: 64px; height: 64px;
  border-radius: 50%;
  border: none;
  background: #4a4aff;
  color: #fff;
  font-size: 28px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
#micBtn:active { transform: scale(0.93); }
#micBtn.listening { background: #e04040; }
#micBtn.processing { background: #666; cursor: default; }

/* 通話ボタン */
#callBtn {
  position: fixed;
  bottom: 24px; right: 100px;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: none;
  background: rgba(0,180,80,0.85);
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  display: none;
  transition: background 0.2s, transform 0.1s;
}
#callBtn:active { transform: scale(0.93); }
#callBtn.incall { background: #e04040; }

/* 通話リクエスト通知 */
#callNotify {
  position: fixed;
  top: 80px; left: 50%;
  transform: translateX(-50%);
  background: rgba(10,20,50,0.95);
  border: 1px solid rgba(0,220,120,0.5);
  border-radius: 14px;
  padding: 16px 24px;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 100;
  backdrop-filter: blur(8px);
}
#callNotify p { font-size: 15px; text-align: center; }
#callNotify .btn-row { display: flex; gap: 10px; }
#callNotify button {
  padding: 7px 20px;
  border-radius: 20px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  font-weight: bold;
}
#callAcceptBtn { background: #22cc66; color: #fff; }
#callDeclineBtn { background: #cc3333; color: #fff; }

#status {
  position: fixed;
  top: 46px; left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  pointer-events: none;
  white-space: nowrap;
}

/* モードインジケータ */
#modeIndicator {
  position: fixed;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 13px;
  pointer-events: none;
  transition: background 0.4s, border-color 0.4s;
}
#modeIndicator.human {
  background: rgba(0,180,100,0.25);
  border-color: rgba(0,220,120,0.5);
}
#modeDot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #aaa;
  transition: background 0.4s;
}
#modeIndicator.human #modeDot { background: #44ee88; }

/* 設定ボタン */
#settingsBtn {
  position: fixed;
  top: 12px; right: 16px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  color: #fff;
  font-size: 20px;
  width: 40px; height: 40px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* 設定パネル */
#settingsPanel {
  position: fixed;
  top: 0; right: -280px;
  width: 260px; height: 100%;
  background: rgba(10,20,40,0.88);
  backdrop-filter: blur(12px);
  border-left: 1px solid rgba(255,255,255,0.15);
  padding: 60px 20px 20px;
  display: flex; flex-direction: column; gap: 24px;
  transition: right 0.3s ease;
  color: #eee;
}
#settingsPanel.open { right: 0; }

.setting-group { display: flex; flex-direction: column; gap: 8px; }
.setting-group label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; }
.setting-group select,
.setting-group .radio-row { width: 100%; }

.radio-row {
  display: flex;
  background: rgba(255,255,255,0.07);
  border-radius: 8px;
  overflow: hidden;
}
.radio-row input[type=radio] { display: none; }
.radio-row label {
  flex: 1;
  text-align: center;
  padding: 8px 4px;
  font-size: 13px;
  cursor: pointer;
  color: #aaa;
  text-transform: none;
  letter-spacing: 0;
  transition: background 0.15s, color 0.15s;
}
.radio-row input[type=radio]:checked + label {
  background: #4a4aff;
  color: #fff;
}

select.panel-select {
  background: #111;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #eee;
  font-size: 13px;
  padding: 8px 10px;
  appearance: none;
  cursor: pointer;
}
select.panel-select option {
  background: #111;
  color: #eee;
}

/* 親密度ゲージ */
#affinity {
  position: fixed;
  top: 50%;
  left: 14px;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  pointer-events: none;
  z-index: 10;
}
#affinity-label {
  font-size: 16px;
  filter: drop-shadow(0 0 6px rgba(255,100,150,0.8));
}
#affinity-track {
  position: relative;
  width: 10px;
  height: 140px;
  background: rgba(255,255,255,0.10);
  border-radius: 5px;
  overflow: hidden;
  box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
}
#affinity-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  border-radius: 5px;
  background: linear-gradient(to top, #a01858, #ff4488, #ffbbcc);
  transition: height 0.7s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes affinityPulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,60,130,0.9); }
  55%  { box-shadow: 0 0 18px 7px rgba(255,60,130,0.35); }
  100% { box-shadow: 0 0 0 0 rgba(255,60,130,0); }
}
.affinity-up { animation: affinityPulse 1s ease-out; }
@keyframes floatUp {
  0%   { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-60px); opacity: 0; }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<canvas id="waveCanvas"></canvas>

<div id="affinity">
  <div id="affinity-label">♥</div>
  <div id="affinity-track"><div id="affinity-fill"></div></div>
</div>

<div id="ui">
  <div id="transcript"></div>
  <div id="response"></div>
</div>
<div id="status">VRMを読み込み中...</div>

<div id="modeIndicator">
  <div id="modeDot"></div>
  <span id="modeText">AI</span>
</div>

<!-- 設定ボタン -->
<button id="settingsBtn" title="設定">⚙️</button>

<!-- 設定パネル -->
<div id="settingsPanel">
  <div class="setting-group">
    <label>ユーザー名</label>
    <input id="usernameInput" class="panel-select" type="text" maxlength="20"
      placeholder="名前を入力..." style="cursor:text;">
  </div>
  <div class="setting-group">
    <label>ペルソナ</label>
    <select id="personaSelect" class="panel-select">
      <option value="">読み込み中...</option>
    </select>
  </div>
  <div class="setting-group">
    <label>TTS エンジン</label>
    <div class="radio-row">
      <input type="radio" name="tts" id="tts-irodori" value="irodori">
      <label for="tts-irodori">IrodoriTTS</label>
      <input type="radio" name="tts" id="tts-voicevox" value="voicevox" checked>
      <label for="tts-voicevox">VoiceVox</label>
    </div>
  </div>
  <div class="setting-group" id="speakerGroup">
    <label>VoiceVox 話者</label>
    <select id="speakerSelect" class="panel-select">
      <option value="">読み込み中...</option>
    </select>
  </div>
  <div class="setting-group">
    <label>AI モデル</label>
    <select id="modelSelect" class="panel-select">
      <option value="">読み込み中...</option>
    </select>
  </div>
  <div class="setting-group">
    <label>マイク</label>
    <select id="micSelect" class="panel-select" style="display:block;position:static;width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#eee;font-size:13px;padding:8px 10px;">
      <option value="">🎤 マイクを選択...</option>
    </select>
  </div>
</div>

<button id="callBtn" title="通話リクエスト">&#9742;</button>
<button id="micBtn" title="クリックして話す">🎤</button>

<div id="callNotify">
  <p id="callNotifyText">通話リクエストが届いています</p>
  <div class="btn-row">
    <button id="callAcceptBtn">承認</button>
    <button id="callDeclineBtn">拒否</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin } from '@pixiv/three-vrm';

// ── Three.js ──────────────────────────────────────────────────────

const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);

// MToonシェーダーを正しく見せるための設定
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping      = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 2.8);
camera.lookAt(0, 1.1, 0);

// ── カメラ操作（ドラッグ±20度 / スクロールズーム） ───────────────
const CAM_CENTER = new THREE.Vector3(0, 1.1, 0);
let camRadius = camera.position.distanceTo(CAM_CENTER);
const CAM_MAX_ANG = Math.PI / 9; // 20度
const CAM_MIN_R   = 1.2;
const CAM_MAX_R   = 7.0;
let camYaw   = 0;
let camPitch = Math.asin((camera.position.y - CAM_CENTER.y) / camRadius);
let camDragging = false;
let camLast     = { x: 0, y: 0 };

function applyCamera() {
  camera.position.set(
    camRadius * Math.sin(camYaw)   * Math.cos(camPitch),
    CAM_CENTER.y + camRadius * Math.sin(camPitch),
    camRadius * Math.cos(camYaw)   * Math.cos(camPitch),
  );
  camera.lookAt(CAM_CENTER);
}

const cv = document.getElementById('canvas');
cv.addEventListener('mousedown',  e => { camDragging = true;  camLast = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('mousemove',  e => {
  if (!camDragging) return;
  camYaw   = Math.max(-CAM_MAX_ANG, Math.min(CAM_MAX_ANG, camYaw   - (e.clientX - camLast.x) * 0.004));
  camPitch = Math.max(-CAM_MAX_ANG, Math.min(CAM_MAX_ANG, camPitch + (e.clientY - camLast.y) * 0.004));
  camLast  = { x: e.clientX, y: e.clientY };
  applyCamera();
});
cv.addEventListener('mouseup',    () => camDragging = false);
cv.addEventListener('mouseleave', () => camDragging = false);
cv.addEventListener('touchstart', e => { e.preventDefault(); camDragging = true;  camLast = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: false });
cv.addEventListener('touchmove',  e => {
  e.preventDefault();
  if (!camDragging) return;
  camYaw   = Math.max(-CAM_MAX_ANG, Math.min(CAM_MAX_ANG, camYaw   - (e.touches[0].clientX - camLast.x) * 0.004));
  camPitch = Math.max(-CAM_MAX_ANG, Math.min(CAM_MAX_ANG, camPitch + (e.touches[0].clientY - camLast.y) * 0.004));
  camLast  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  applyCamera();
}, { passive: false });
cv.addEventListener('touchend', () => camDragging = false);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  camRadius = Math.max(CAM_MIN_R, Math.min(CAM_MAX_R, camRadius + e.deltaY * 0.006));
  applyCamera();
}, { passive: false });

// 半球ライト: 空の色(上) + 海の色(下) でキャラを自然に包む
const hemiLight = new THREE.HemisphereLight(0xc8e8ff, 0x2277aa, 2.5);
scene.add(hemiLight);

// メイン太陽光（斜め前から）
const sunLight = new THREE.DirectionalLight(0xfff8e8, 3.0);
sunLight.position.set(2, 5, 4);
scene.add(sunLight);

// 正面フィルライト（逆光の影を和らげる）
const fillLight = new THREE.DirectionalLight(0xaad4ff, 1.2);
fillLight.position.set(-2, 1, 6);
scene.add(fillLight);

// 海面プレーン（幻想的な深い青紫）
const ocean = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({
    color: 0x0a2a6e,
    emissive: 0x001030,
    roughness: 0.05,
    metalness: 0.6,
    transparent: true,
    opacity: 0.88,
  })
);
ocean.rotation.x = -Math.PI / 2;
ocean.position.y = -0.85;
scene.add(ocean);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── VRM ──────────────────────────────────────────────────────────

let vrm = null;
// morphTargetInfluences を直接操作するためのメッシュ参照
let morphMeshes = []; // [{mesh, aaIdx, blinkIdx}]

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

loader.load(
  '/assets/model.vrm',
  gltf => {
    vrm = gltf.userData.vrm;
    scene.add(vrm.scene);
    applyRestPose(vrm);
    document.getElementById('status').textContent = 'マイクボタンを押して話しかけてください';

    // Wendy_Pet を traverse 後に切り離す（traverse 中の DOM 変更は NG）
    let wendyPetNode = null;
    vrm.scene.traverse(obj => { if (obj.name === 'Wendy_Pet') wendyPetNode = obj; });
    if (wendyPetNode) {
      wendyPetNode.removeFromParent();
      scene.add(wendyPetNode);
      wendyPetNode.position.set(0, 0, 0); // シーン原点基準にリセット
      candyRoot        = wendyPetNode;
      candyOrbitRadius = 0.45;
      candyBaseY       = 0.05; // キャラの胸〜顔あたり
    }

    // モーフターゲットを持つメッシュを収集
    vrm.scene.traverse(obj => {
      if (!obj.isMesh || !obj.morphTargetDictionary) return;
      const dict = obj.morphTargetDictionary;
      const aaIdx    = dict['vrc.v_aa'] ?? dict['A'] ?? dict['a'];
      const blinkIdx = dict['eye_blink'] ?? dict['vrc.Blink'] ?? dict['Blink'];
      if (aaIdx !== undefined || blinkIdx !== undefined) {
        morphMeshes.push({ mesh: obj, aaIdx, blinkIdx });
      }
    });
  },
  xhr => {
    if (xhr.total) {
      document.getElementById('status').textContent =
        `VRM読み込み中 ${Math.round(xhr.loaded / xhr.total * 100)}%`;
    }
  },
  err => {
    console.error(err);
    document.getElementById('status').textContent = 'assets/model.vrm が見つかりません';
  }
);

// T字/万歳ポーズ → 自然な直立ポーズ
// VRMのキャラクター左腕は+X方向に延びており、
// 正のZ回転は上(万歳)方向、負のZ回転が下(自然)方向になる
function applyRestPose(vrm) {
  const h = vrm.humanoid;
  if (!h) return;
  // x: 腕を前に出してめり込みを防ぐ, z: 腕の下げ角度（68度）
  const pose = [
    ['leftUpperArm',  [0.15, 0, -Math.PI * 0.38]],
    ['rightUpperArm', [0.15, 0,  Math.PI * 0.38]],
    ['leftLowerArm',  [0, 0, -0.08]],
    ['rightLowerArm', [0, 0,  0.08]],
  ];
  for (const [bone, [x, y, z]] of pose) {
    const node = h.getNormalizedBoneNode(bone);
    if (node) node.rotation.set(x, y, z);
  }
}

// ── 音声再生 + リップシンク ───────────────────────────────────────

const audioCtx  = new AudioContext();
const analyser  = audioCtx.createAnalyser();
analyser.fftSize = 256;
analyser.connect(audioCtx.destination);
const timeDomain = new Float32Array(analyser.fftSize);
// ブラウザのautoplay制限を解除：最初のユーザー操作で再開
document.addEventListener('click', () => {
  audioCtx.state === 'suspended' && audioCtx.resume();
}, { capture: true });
document.addEventListener('touchstart', () => {
  audioCtx.state === 'suspended' && audioCtx.resume();
}, { capture: true });

const audioQueue = [];
let isPlaying = false;

function playNext() {
  if (!audioQueue.length) { isPlaying = false; return; }
  isPlaying = true;
  audioCtx.decodeAudioData(
    audioQueue.shift(),
    buf => {
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(analyser);
      src.start();
      src.onended = playNext;
    },
    () => playNext()  // デコード失敗（通話後の残留 PCM 等）はスキップして次へ
  );
}

function enqueueWav(arrayBuffer) {
  audioQueue.push(arrayBuffer.slice(0));
  if (!isPlaying) playNext();
}

function getLipValue() {
  if (!isPlaying || audioCtx.state !== 'running') return 0;
  analyser.getFloatTimeDomainData(timeDomain);
  let sum = 0;
  for (const v of timeDomain) sum += v * v;
  return Math.min(1.0, Math.sqrt(sum / timeDomain.length) * 10);
}

// ── 波形エフェクト ────────────────────────────────────────────────

const waveCanvas = document.getElementById('waveCanvas');
const waveCtx    = waveCanvas.getContext('2d');
waveCanvas.width  = 320;
waveCanvas.height = 56;

let vadAnalyser = null;
let freqData    = null;

function drawWaveform() {
  waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
  if (!vadAnalyser || !speaking) return;

  vadAnalyser.getByteFrequencyData(freqData);

  const barCount = 48;
  const gap      = 2;
  const barW     = (waveCanvas.width - gap * (barCount - 1)) / barCount;
  const cx       = waveCanvas.width / 2;
  const half     = barCount / 2;

  for (let i = 0; i < barCount; i++) {
    // 中心から外側に向かって対称配置
    const idx    = Math.floor(Math.abs(i - half) / half * (freqData.length * 0.6));
    const freq   = freqData[Math.min(idx, freqData.length - 1)];
    const ratio  = freq / 255;
    const h      = Math.max(3, ratio * waveCanvas.height);
    const x      = i * (barW + gap);
    const y      = (waveCanvas.height - h) / 2;

    // 中心ほど明るい紫〜外側は青
    const bright = 0.4 + ratio * 0.6;
    waveCtx.fillStyle = `rgba(${Math.round(80 + 80 * ratio)}, 80, 255, ${bright})`;
    waveCtx.beginPath();
    waveCtx.roundRect(x, y, barW, h, 2);
    waveCtx.fill();
  }
}

// ── 泡パーティクル ────────────────────────────────────────────────
const BUBBLE_N = 90;
const _bGeo = new THREE.SphereGeometry(1, 7, 5);
const _bMat = new THREE.MeshStandardMaterial({
  color: 0x88ddff, emissive: 0x003366, emissiveIntensity: 0.4,
  transparent: true, opacity: 0.22, roughness: 0.0, metalness: 0.5,
  depthWrite: false,
});
const bubbleMesh = new THREE.InstancedMesh(_bGeo, _bMat, BUBBLE_N);
bubbleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(bubbleMesh);

function _mkBubble(yOverride) {
  return {
    x: (Math.random() - 0.5) * 6,
    y: yOverride ?? (Math.random() * 5 - 1.5),
    z: (Math.random() - 0.5) * 4 - 0.3,
    r: 0.012 + Math.random() * 0.055,
    vy: 0.06 + Math.random() * 0.16,
    drift: Math.random() * Math.PI * 2,
    driftAmp: 0.06 + Math.random() * 0.12,
    driftSpd: 0.3 + Math.random() * 0.6,
  };
}
const _bubbles = Array.from({ length: BUBBLE_N }, () => _mkBubble());
const _bDummy  = new THREE.Object3D();

function updateBubbles(t, dt) {
  for (let i = 0; i < BUBBLE_N; i++) {
    const b = _bubbles[i];
    b.y += b.vy * dt;
    if (b.y > 3.8) _bubbles[i] = _mkBubble(-1.5);
    _bDummy.position.set(
      b.x + Math.sin(t * b.driftSpd + b.drift) * b.driftAmp,
      b.y,
      b.z,
    );
    _bDummy.scale.setScalar(b.r);
    _bDummy.updateMatrix();
    bubbleMesh.setMatrixAt(i, _bDummy.matrix);
  }
  bubbleMesh.instanceMatrix.needsUpdate = true;
}

// ── アニメーションループ ──────────────────────────────────────────

// candy ゴーストの円運動用
let candyRoot        = null;
const candyOrbitCenter = new THREE.Vector3();
let candyOrbitRadius = 0.45;
let candyBaseY       = 1.2;

const clock = new THREE.Clock();
let elapsed   = 0;
let lipSmooth = 0;

// 瞬き
let blinkTimer = 0;
let blinkPhase = 0; // 0=待機 1=閉じ中 2=開き中
let blinkValue = 0;
let nextBlink  = 3 + Math.random() * 4;

(function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  elapsed += delta;

  if (vrm) {
    // リップシンク
    const lipTarget = getLipValue();
    lipSmooth += (lipTarget - lipSmooth) * (1 - Math.exp(-delta * 18));

    // 瞬き
    blinkTimer += delta;
    if (blinkPhase === 0 && blinkTimer >= nextBlink) {
      blinkPhase = 1; blinkTimer = 0;
      nextBlink = 3 + Math.random() * 4;
    }
    if (blinkPhase === 1) {
      blinkValue = Math.min(1, blinkValue + delta * 12);
      if (blinkValue >= 1) blinkPhase = 2;
    } else if (blinkPhase === 2) {
      blinkValue = Math.max(0, blinkValue - delta * 8);
      if (blinkValue <= 0) blinkPhase = 0;
    }

    // morphTargetInfluences を直接制御（expressionManager が null のモデル対応）
    for (const { mesh, aaIdx, blinkIdx } of morphMeshes) {
      if (aaIdx    !== undefined) mesh.morphTargetInfluences[aaIdx]    = lipSmooth;
      if (blinkIdx !== undefined) mesh.morphTargetInfluences[blinkIdx] = blinkValue;
    }

    // 上半身のゆらゆら
    const spine = vrm.humanoid?.getNormalizedBoneNode('spine');
    const chest = vrm.humanoid?.getNormalizedBoneNode('chest');
    if (spine) spine.rotation.z = Math.sin(elapsed * 0.8) * 0.04;
    if (chest) chest.rotation.z = Math.sin(elapsed * 0.8 + 0.5) * 0.02;

    // 腕の揺れ（左右で位相をずらして自然に）
    const lUA = vrm.humanoid?.getNormalizedBoneNode('leftUpperArm');
    const rUA = vrm.humanoid?.getNormalizedBoneNode('rightUpperArm');
    if (lUA) { lUA.rotation.x = 0.15; lUA.rotation.z = -Math.PI * 0.38 + Math.sin(elapsed * 0.7) * 0.05; }
    if (rUA) { rUA.rotation.x = 0.15; rUA.rotation.z =  Math.PI * 0.38 + Math.sin(elapsed * 0.7 + Math.PI) * 0.05; }

    vrm.update(delta);

    // candy ゴーストを円状に移動
    if (candyRoot) {
      const a = elapsed * 0.7; // 公転速度
      candyRoot.position.set(
        Math.cos(a) * candyOrbitRadius,
        candyBaseY + Math.sin(elapsed * 1.1) * 0.06, // 上下にふわふわ
        Math.sin(a) * candyOrbitRadius,
      );
      candyRoot.rotation.y = -a; // キャラ方向を向き続ける
    }
  }
  updateBubbles(elapsed, delta);
  drawWaveform();
  renderer.render(scene, camera);
})();

// ── Cookie + 親密度 ───────────────────────────────────────────────

function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function setCookie(name, value, days = 365) {
  const d = new Date();
  d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/`;
}

let affinity  = Math.min(100, Math.max(0, parseInt(getCookie('affinity') ?? '50')));
let myName    = getCookie('username') ?? '';

const affinityFill = document.getElementById('affinity-fill');

function updateAffinityGauge() {
  affinityFill.style.height = affinity + '%';
  setCookie('affinity', affinity);
}
updateAffinityGauge();

function spawnAffinityParticles() {
  const rect = affinityFill.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top;
  const symbols = ['♥', '♥', '✦', '★'];
  symbols.forEach((sym, i) => {
    const p = document.createElement('span');
    p.textContent = sym;
    const ox = (Math.random() - 0.5) * 20;
    p.style.cssText = `
      position:fixed;left:${cx + ox - 7}px;top:${cy}px;
      font-size:${9 + Math.random() * 7}px;color:#ff88bb;
      pointer-events:none;z-index:9999;

    setTimeout(() => p.remove(), 1100 + i * 100);
  });
  // バー自体を光らせる
  affinityFill.classList.remove('affinity-up');
  void affinityFill.offsetWidth; // reflow でリセット
  affinityFill.classList.add('affinity-up');
}

// ── 通話音声 (Web Audio API — 生 PCM タイムスタンプ連結再生) ────────
// パケット形式: [4 bytes Uint32LE: 送信側 sampleRate][Float32[] PCM]
// → 固定レートを使わず実測値を送ることで iOS/PC 間のレート不一致を解消

let isInCall     = false;
let nextPlayTime = 0;
const LATENCY_THRESHOLD = 0.15;

function initCallAudio() {
  audioCtx.resume().catch(() => {});
  nextPlayTime = 0;
}

function preinitCallAudio() {
  audioCtx.resume().catch(() => {});
}

function enqueuePcmChunk(arrayBuffer) {
  if (arrayBuffer.byteLength < 8) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  // 先頭 4 バイト = 送信側の実際のサンプルレート
  const senderRate = new DataView(arrayBuffer).getUint32(0, true);
  const pcm = new Float32Array(arrayBuffer, 4);
  if (!pcm.length || senderRate < 8000 || senderRate > 192000) return;
  const buf = audioCtx.createBuffer(1, pcm.length, senderRate);
  buf.copyToChannel(pcm, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  const now = audioCtx.currentTime;
  // 遅延が蓄積したらリセット（引き伸ばし・無音化を防ぐ）
  if (nextPlayTime < now || (nextPlayTime - now) > LATENCY_THRESHOLD) nextPlayTime = now + 0.05;
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;
}

function teardownCallAudio() {
  audioQueue.length = 0;
  isPlaying = false;
  nextPlayTime = 0;
}

// ── WebSocket ────────────────────────────────────────────────────

const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${wsProto}//${location.host}/ws`);
ws.binaryType = 'arraybuffer';
ws.onopen = () => {
  if (speakerSelect.value)
    ws.send(JSON.stringify({ type: 'set_speaker', speaker: parseInt(speakerSelect.value) }));
  ws.send(JSON.stringify({ type: 'set_affinity', value: affinity }));
  if (myName) ws.send(JSON.stringify({ type: 'set_username', username: myName }));
};

const transcriptEl = document.getElementById('transcript');
const responseEl   = document.getElementById('response');
const micBtn       = document.getElementById('micBtn');
const statusEl     = document.getElementById('status');
const micSelect    = document.getElementById('micSelect');

ws.onmessage = e => {
  if (e.data instanceof ArrayBuffer) {
    if (isInCall) {
      enqueuePcmChunk(e.data);
    } else {
      enqueueWav(e.data);
    }
    return;
  }
  const msg = JSON.parse(e.data);
  const modeIndicator  = document.getElementById('modeIndicator');
  const modeText       = document.getElementById('modeText');
  const callBtn        = document.getElementById('callBtn');
  const callNotify     = document.getElementById('callNotify');
  const callNotifyText = document.getElementById('callNotifyText');

  if (msg.type === 'transcript') {
    const label = msg.from ? msg.from : (myName || 'あなた');
    transcriptEl.textContent = `${label}: ${msg.text}`;
    if (!modeIndicator.classList.contains('human'))
      responseEl.textContent = 'AI: ';
  } else if (msg.type === 'llm_text') {
    responseEl.textContent += msg.text;
  } else if (msg.type === 'peer_text') {
    const label = msg.from || '相手';
    responseEl.textContent = `${label}: ${msg.text}`;
  } else if (msg.type === 'mode') {
    const isHuman = msg.mode === 'human';
    modeIndicator.classList.toggle('human', isHuman);
    modeText.textContent = isHuman ? `接続中 (${msg.users}人)` : 'AI';
    callBtn.style.display = isHuman ? 'block' : 'none';
    if (!isHuman) {
      callBtn.classList.remove('incall');
      callNotify.style.display = 'none';
    }
  } else if (msg.type === 'call_request') {
    const from = msg.from || '相手';
    callNotifyText.textContent = `${from} さんから音声通話のリクエストがあります`;
    callNotify.style.display = 'flex';
  } else if (msg.type === 'call_start') {
    callNotify.style.display = 'none';
    callBtn.classList.add('incall');
    callBtn.title = '通話終了';
    modeText.textContent = '音声通話中';
    statusEl.textContent = '音声通話中';
    isInCall = true;
    initCallAudio();
  } else if (msg.type === 'call_end') {
    callBtn.classList.remove('incall');
    callBtn.title = '通話リクエスト';
    statusEl.textContent = '話しかけてください（自動検知）';
    isInCall = false;
    teardownCallAudio();
    // MediaRecorder を再起動してクリーンな EBML ヘッダーを作り直す
    // （通話中に蓄積された続きクャンクが audio_buf に入ると decode_webm が壊れる）
    if (mediaRecorder) {
      mediaRecorder.onstop = () => {
        // final chunk 送信後にバックエンドの audio_buf もクリア
        if (ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: 'flush_audio_buf' }));
        mediaRecorder.start(200);
      };
      if (mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      } else {
        if (ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: 'flush_audio_buf' }));
        mediaRecorder.start(200);
      }
    }
  } else if (msg.type === 'call_declined') {
    statusEl.textContent = 'リクエストが拒否されました';
  } else if (msg.type === 'done') {
    processing = false;
    micBtn.className = '';
    statusEl.textContent = '話しかけてください（自動検知）';
    if (mediaRecorder && mediaRecorder.state === 'inactive') {
      mediaRecorder.start(200);
    }
  } else if (msg.type === 'affinity') {
    const prev = affinity;
    affinity = Math.min(100, Math.max(0, affinity + (msg.delta || 0)));
    updateAffinityGauge();
    if (affinity > prev) spawnAffinityParticles();
    if (ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ type: 'set_affinity', value: affinity }));
  }
};
ws.onerror = () => { statusEl.textContent = 'WebSocket接続エラー'; };

// ── マイク録音 + デバイス選択 + エネルギーVAD ────────────────────

let mediaRecorder  = null;
let currentStream  = null;
let speaking       = false;
let processing     = false;
let silenceTimer   = null;
let selectedDevice = '';

const VAD_THRESHOLD = 0.012;
const SILENCE_MS    = 1500;

async function populateDeviceList() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const inputs  = devices.filter(d => d.kind === 'audioinput');
  micSelect.innerHTML = '';
  inputs.forEach(d => {
    const opt   = document.createElement('option');
    opt.value   = d.deviceId;
    opt.text    = d.label || `マイク ${micSelect.options.length + 1}`;
    if (d.deviceId === selectedDevice) opt.selected = true;
    micSelect.appendChild(opt);
  });
}

async function startMic(deviceId) {
  // 既存ストリームを止める
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    if (mediaRecorder?.state !== 'inactive') mediaRecorder.stop();
  }

  currentStream = await navigator.mediaDevices.getUserMedia({
    audio: deviceId ? { deviceId: { exact: deviceId } } : true,
  });

  // VAD + 通話送信 用 AudioContext（ネイティブレート — 強制指定しない）
  const vadCtx = new AudioContext();
  const vadSrc = vadCtx.createMediaStreamSource(currentStream);
  vadAnalyser  = vadCtx.createAnalyser();
  vadAnalyser.fftSize = 256;
  freqData     = new Uint8Array(vadAnalyser.frequencyBinCount);
  vadSrc.connect(vadAnalyser);

  // ScriptProcessorNode: 通話中に生 PCM を ~20ms 単位で即送信
  // パケット = [4 bytes: 実 sampleRate (Uint32LE)][Float32[] PCM]
  const callProc = vadCtx.createScriptProcessor(1024, 1, 1);
  callProc.onaudioprocess = e => {
    if (!isInCall || ws.readyState !== WebSocket.OPEN) return;
    const pcm  = e.inputBuffer.getChannelData(0); // Float32Array (view)
    const rate = vadCtx.sampleRate;               // 実際のサンプルレート
    const packet = new ArrayBuffer(4 + pcm.byteLength);
    new DataView(packet).setUint32(0, rate, true); // LE
    new Float32Array(packet, 4).set(pcm);
    ws.send(packet);
  };
  vadSrc.connect(callProc);
  callProc.connect(vadCtx.destination); // ダミー接続（ノードを動かすために必要）

  // MediaRecorder: AI モード専用（Whisper に WebM が必要）
  mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'audio/webm;codecs=opus' });
  mediaRecorder.ondataavailable = e => {
    // 通話中は ScriptProcessorNode が担当するので WebM は送らない
    if (e.data.size > 0 && !isInCall && !processing && ws.readyState === WebSocket.OPEN) {
      ws.send(e.data);
    }
  };
  mediaRecorder.start(200);

  // VAD ループ
  const vadBuf = new Float32Array(vadAnalyser.fftSize);
  function vadLoop() {
    if (!processing) {
      vadAnalyser.getFloatTimeDomainData(vadBuf);
      let sum = 0;
      for (const v of vadBuf) sum += v * v;
      const rms = Math.sqrt(sum / vadBuf.length);

      if (rms > VAD_THRESHOLD) {
        if (!speaking) {
          speaking = true;
          micBtn.className = 'listening';
          waveCanvas.classList.add('active');
          statusEl.textContent = '🔴 認識中...';
        }
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (speaking) {
            speaking = false;
            waveCanvas.classList.remove('active');

            if (isInCall) {
              // 通話中: レコーダーは止めない。チャンクは流しっぱなし
              micBtn.className = '';
              return;
            }

            // AI / テキスト中継モード: 従来通り stop → end_speech
            // processing=true にするのは onstop 後 — こうしないと
            // ondataavailable（最終チャンク）が processing=true でブロックされる
            micBtn.className = 'processing';
            statusEl.textContent = '処理中...';
            mediaRecorder.onstop = () => {
              processing = true;
              ws.send(JSON.stringify({ type: 'end_speech' }));
            };
            mediaRecorder.stop();
          }
        }, SILENCE_MS);
      }
    }
    requestAnimationFrame(vadLoop);
  }
  vadLoop();
}

// デバイス変更
micSelect.addEventListener('change', async () => {
  selectedDevice = micSelect.value;
  if (mediaRecorder) await startMic(selectedDevice);
});

async function initMic() {
  if (mediaRecorder) return;
  try {
    statusEl.textContent = 'マイク準備中...';
    await startMic('');
    await populateDeviceList();
    statusEl.textContent = '話しかけてください（自動検知）';
  } catch (err) {
    statusEl.textContent = 'マイクへのアクセスが拒否されました（🎤 で再試行）';
    console.error(err);
  }
}

// ページ読み込み時に自動でマイク初期化
